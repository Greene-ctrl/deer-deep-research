# Configuration for the DeerFlow application
#
# Guidelines:
# - Copy this file to `config.yaml` and customize it for your environment
# - The default path of this configuration file is `config.yaml` in the current working directory.
#   However you can change it using the `DEER_FLOW_CONFIG_PATH` environment variable.
# - Environment variables are available for all field values. Example: `api_key: $OPENAI_API_KEY`
# - The `use` path is a string that looks like "package_name.sub_package_name.module_name:class_name/variable_name".

# ============================================================================
# Models Configuration
# ============================================================================
# Configure available LLM models for the agent to use

models:
  # Blablador models (Default)
  # Blablador provides an OpenAI-compatible API at https://api.helmholtz-blablador.fz-juelich.de/v1
  - name: blablador-large
    display_name: Blablador Large
    use: langchain_openai:ChatOpenAI
    model: alias-large
    base_url: https://api.helmholtz-blablador.fz-juelich.de/v1
    api_key: $BLABLADOR_API_KEY
    max_tokens: 4096
    temperature: 0.7
    supports_vision: false

  - name: blablador-fast
    display_name: Blablador Fast
    use: langchain_openai:ChatOpenAI
    model: alias-fast
    base_url: https://api.helmholtz-blablador.fz-juelich.de/v1
    api_key: $BLABLADOR_API_KEY
    max_tokens: 4096
    temperature: 0.1
    supports_vision: false

  # Example: OpenAI model
  - name: gpt-4
    display_name: GPT-4
    use: langchain_openai:ChatOpenAI
    model: gpt-4
    api_key: $OPENAI_API_KEY
    max_tokens: 4096
    temperature: 0.7
    supports_vision: true

# ============================================================================
# Tool Groups Configuration
# ============================================================================
# Define groups of tools for organization and access control

tool_groups:
  - name: web
  - name: file:read
  - name: file:write
  - name: bash

# ============================================================================
# Tools Configuration
# ============================================================================
# Configure available tools for the agent to use

tools:
  - name: web_search
    group: web
    use: src.community.tavily.tools:web_search_tool
    max_results: 5
  - name: web_fetch
    group: web
    use: src.community.jina_ai.tools:web_fetch_tool
    timeout: 10
  - name: image_search
    group: web
    use: src.community.image_search.tools:image_search_tool
    max_results: 5
  - name: ls
    group: file:read
    use: src.sandbox.tools:ls_tool
  - name: read_file
    group: file:read
    use: src.sandbox.tools:read_file_tool
  - name: write_file
    group: file:write
    use: src.sandbox.tools:write_file_tool
  - name: str_replace
    group: file:write
    use: src.sandbox.tools:str_replace_tool
  - name: bash
    group: bash
    use: src.sandbox.tools:bash_tool

# ============================================================================
# Sandbox Configuration
# ============================================================================
sandbox:
  use: src.sandbox.local:LocalSandboxProvider

# ============================================================================
# Skills Configuration
# ============================================================================
skills:
  container_path: /mnt/skills

# ============================================================================
# Title Generation Configuration
# ============================================================================
title:
  enabled: true
  max_words: 6
  max_chars: 60
  model_name: blablador-fast

# ============================================================================
# Summarization Configuration
# ============================================================================
summarization:
  enabled: true
  model_name: blablador-fast
  trigger:
    - type: tokens
      value: 15564
  keep:
    type: messages
    value: 10
  trim_tokens_to_summarize: 15564

# ============================================================================
# Memory Configuration
# ============================================================================
memory:
  enabled: true
  storage_path: .deer-flow/memory.json
  debounce_seconds: 30
  model_name: blablador-fast
  max_facts: 100
  fact_confidence_threshold: 0.7
  injection_enabled: true
  max_injection_tokens: 2000
